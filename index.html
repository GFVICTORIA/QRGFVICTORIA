<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GF Victoria - Guest Experience</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Times New Roman", serif;
    background-image: url("fondo qr3.jpg");
    background-size: cover;
    background-position: center;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    position:relative;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
}

.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:700px;
}

h1{
    font-size:48px;
    font-style:italic;
    margin-bottom:50px;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
}

.menu{
    display:flex;
    flex-direction:column;
    gap:18px;
}

button{
    padding:16px 25px;
    border:none;
    border-radius:14px;
    background:rgba(0,0,0,0.65);
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
    backdrop-filter: blur(4px);
}

button:hover{
    transform:scale(1.03);
    background:rgba(0,0,0,0.85);
}

.back-btn{
    margin-top:25px;
    background:#a0002c;
}

.hidden{
    display:none;
}

.logo{
    margin-top:40px;
    font-size:18px;
    letter-spacing:2px;
}

@media(max-width:768px){

h1{
    font-size:34px;
}

button{
    font-size:18px;
    padding:14px;
}

}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <h1 id="title">Select Language / Selecciona idioma</h1>

    <!-- IDIOMAS -->
    <div id="languageMenu" class="menu">

        <button onclick="showMainMenu('es')">ESPAÑOL</button>
        <button onclick="showMainMenu('en')">ENGLISH</button>

    </div>

    <!-- MENU PRINCIPAL -->
    <div id="mainMenu" class="menu hidden"></div>

    <!-- SUBMENU -->
    <div id="subMenu" class="menu hidden"></div>

    <div class="logo">GF VICTORIA</div>

</div>

<script>

let currentLang = "es";

const content = {

es: {

main: [
    { name:"Excursiones", action:"excursiones" },
    { name:"Traslados", pdf:"traslados.pdf" },
    { name:"Complementos de estancia", action:"extras" },
    { name:"Rent a car", pdf:"rentacar.pdf" }
],

excursiones: [
    { name:"Lo más vendido del mes", pdf:"mas-vendido.pdf" },
    { name:"Información general", pdf:"general.pdf" },
    { name:"Barcos", pdf:"barcos.pdf" },
    { name:"Actividades en el agua", pdf:"agua.pdf" },
    { name:"Actividades terrestres", pdf:"terrestres.pdf" },
    { name:"Fondos Marinos", pdf:"fondos.pdf" },
    { name:"Cielos", pdf:"cielos.pdf" },
    { name:"Para toda la familia", pdf:"familia.pdf" },
    { name:"Espectáculos", pdf:"shows.pdf" }
],

extras: [
    { name:"Paquete de Cumpleaños", pdf:"cumpleanos.pdf" },
    { name:"Paquete Romántico", pdf:"romantico.pdf" },
    { name:"Accesorios de bebé", pdf:"bebe.pdf" }
]

},

en: {

main: [
    { name:"Excursions", action:"excursiones" },
    { name:"Transfers", pdf:"transfers.pdf" },
    { name:"Stay Complements", action:"extras" },
    { name:"Rent a car", pdf:"rentacar-en.pdf" }
],

excursiones: [
    { name:"Best sellers of the month", pdf:"best-sellers.pdf" },
    { name:"General Information", pdf:"general-en.pdf" },
    { name:"Boats", pdf:"boats.pdf" },
    { name:"Water Activities", pdf:"water.pdf" },
    { name:"Land Activities", pdf:"land.pdf" },
    { name:"Sea Life", pdf:"sealife.pdf" },
    { name:"Sky", pdf:"sky.pdf" },
    { name:"For the whole family", pdf:"family.pdf" },
    { name:"Shows", pdf:"shows-en.pdf" }
],

extras: [
    { name:"Birthday Package", pdf:"birthday.pdf" },
    { name:"Romantic Package", pdf:"romantic.pdf" },
    { name:"Baby Accessories", pdf:"baby.pdf" }
]

}

};

function showMainMenu(lang){

    currentLang = lang;

    document.getElementById("languageMenu").classList.add("hidden");

    const menu = document.getElementById("mainMenu");

    menu.innerHTML = "";

    content[lang].main.forEach(item => {

        const btn = document.createElement("button");

        btn.textContent = item.name;

        if(item.pdf){

            btn.onclick = () => {
                window.open(item.pdf, "_blank");
            };

        } else {

            btn.onclick = () => {
                showSubMenu(item.action);
            };

        }

        menu.appendChild(btn);

    });

    const back = document.createElement("button");
    back.textContent = "← Volver";
    back.className = "back-btn";

    if(lang === "en"){
        back.textContent = "← Back";
    }

    back.onclick = goHome;

    menu.appendChild(back);

    menu.classList.remove("hidden");

}

function showSubMenu(type){

    document.getElementById("mainMenu").classList.add("hidden");

    const sub = document.getElementById("subMenu");

    sub.innerHTML = "";

    content[currentLang][type].forEach(item => {

        const btn = document.createElement("button");

        btn.textContent = item.name;

        btn.onclick = () => {
            window.open(item.pdf, "_blank");
        };

        sub.appendChild(btn);

    });

    const back = document.createElement("button");

    back.className = "back-btn";

    if(currentLang === "es"){
        back.textContent = "← Volver";
    }else{
        back.textContent = "← Back";
    }

    back.onclick = () => {

        sub.classList.add("hidden");
        document.getElementById("mainMenu").classList.remove("hidden");

    };

    sub.appendChild(back);

    sub.classList.remove("hidden");

}

function goHome(){

    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("subMenu").classList.add("hidden");
    document.getElementById("languageMenu").classList.remove("hidden");

}

</script>

</body>
</html>
