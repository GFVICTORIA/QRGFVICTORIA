<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GF Victoria - Actividades</title>

<style>

body{
    margin:0;
    font-family: "Times New Roman", serif;
    text-align:center;
    background-image: url("fondo qr3.jpg");
    background-size: cover;
    background-position: center;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    font-style: italic;
    font-size:40px;
    margin-bottom:40px;
}

.languages{
    display:flex;
    gap:80px;
    margin-bottom:30px;
}

.language-btn{
    font-size:36px;
    color:#c4002f;
    border:none;
    background:none;
    cursor:pointer;
    font-weight:bold;
}

.language-btn:hover{
    opacity:0.7;
}

.pdf-list{
    margin-top:20px;
}

.pdf-btn{
    display:block;
    margin:10px auto;
    padding:12px 30px;
    font-size:20px;
    border:none;
    border-radius:8px;
    background-color:rgba(0,0,0,0.7);
    color:white;
    cursor:pointer;
}

.pdf-btn:hover{
    background-color:black;
}

.logo{
    position:absolute;
    bottom:30px;
    font-size:20px;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>Select language / Selecciona idioma / Sprache wählen</h1>

<div class="languages">

<button class="language-btn" onclick="selectLanguage('en')">• ENGLISH</button>
<button class="language-btn" onclick="selectLanguage('es')">• ESPAÑOL</button>
<button class="language-btn" onclick="selectLanguage('de')">• DEUTSCH</button>

</div>

<div class="pdf-list" id="pdfList"></div>


<script>

const pdfData = {

es: {
"INFORMACIÓN GENERAL": "general.pdf",
"BARCOS": "barcos.pdf",
"ACTIVIDADES EN EL AGUA": "actividades en el agua.pdf",
"FONDOS MARINOS": "fondos marinos.pdf",
"ACTIVIDADES TERRESTRES": "actividades terrestre.pdf",
"CIELOS": "CIELOS.pdf",
"PARA TODA LA FAMILIA": "familia.pdf",
"OCIO NOCTURNO": "nocturno 2.pdf"
},

en: {
"GENERAL INFORMATION": "general.pdf",
"BOATS": "barcos.pdf",
"WATER ACTIVITIES": "actividades en el agua.pdf",
"SEA LIFE": "fondos marinos.pdf",
"LAND ACTIVITIES": "actividades terrestre.pdf",
"SKY": "CIELOS.pdf",
"FOR THE WHOLE FAMILY": "familia.pdf",
"NIGHTLIFE": "nocturno 2.pdf"
},

de: {
"ALLGEMEINE INFORMATION": "generalA.pdf",
"BOOTE": "BARCO A.pdf",
"WASSERAKTIVITÄTEN": "AGUA A.pdf",
"MEERESBODEN": "FONDOS A.pdf",
"LAND AKTIVITÄTEN": "TERRESTRE A.pdf",
"HIMMEL": "CIELOS A.pdf",
"FÜR DIE GANZE FAMILIE": "FAMILIA A.pdf",
"NACHTLEBEN": "NOCHE A.pdf"
}

};

function selectLanguage(lang){

const list = document.getElementById("pdfList");
list.innerHTML = "";

for (const [name,url] of Object.entries(pdfData[lang])){

const btn = document.createElement("button");

btn.className="pdf-btn";
btn.textContent=name;

btn.onclick=()=>window.open(url,"_blank");

list.appendChild(btn);

}

}

</script>

</body>
</html>
