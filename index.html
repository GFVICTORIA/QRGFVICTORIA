<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GF Victoria - Selector</title>
<style>
    /* Importamos una fuente elegante de Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Roboto:wght@300;400&display=swap');

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Fondo con textura suave similar a la imagen */
        background: #fdfdfd url('https://www.transparenttextures.com/patterns/white-wall.png'); 
        /* Para el efecto de "humo" azulado, podrías usar una imagen de fondo real */
        background-image: radial-gradient(circle at center, rgba(210, 230, 240, 0.5) 0%, rgba(255, 255, 255, 1) 70%);
        font-family: 'Roboto', sans-serif;
        color: #333;
    }

    .container {
        text-align: center;
        max-width: 90%;
    }

    /* Título principal con estilo cursiva elegante */
    h1 {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 2.2rem;
        margin-bottom: 40px;
        color: #1a1a1a;
    }

    /* Contenedor de idiomas */
    .languages {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 50px;
        flex-wrap: wrap;
    }

    .lang-item {
        display: flex;
        align-items: center;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .lang-item:hover {
        transform: scale(1.05);
    }

    /* El punto rojo característico */
    .dot {
        height: 10px;
        width: 10px;
        background-color: #a01a33; /* Color vinotinto */
        border-radius: 50%;
        display: inline-block;
        margin-right: 10px;
    }

    .lang-text {
        font-family: 'Playfair Display', serif;
        font-size: 1.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #1a1a1a;
    }

    /* Lista de opciones (PDFs) */
    .pdf-list {
        display: none; /* Se activa al elegir idioma */
        animation: fadeIn 0.8s ease-in-out;
    }

    .pdf-item {
        font-family: 'Playfair Display', serif;
        font-size: 1.6rem;
        margin: 15px 0;
        cursor: pointer;
        color: #1a1a1a;
        text-decoration: none;
        display: block;
        transition: color 0.3s;
    }

    .pdf-item:hover {
        color: #a01a33;
    }

    /* Logo al final */
    .footer-logo {
        margin-top: 60px;
        max-width: 150px;
        opacity: 0.8;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Select language / Selecciona idioma / Sprache wählen</h1>

    <div class="languages">
        <div class="lang-item" onclick="selectLanguage('en')">
            <span class="dot"></span><span class="lang-text">ENGLISH</span>
        </div>
        <div class="lang-item" onclick="selectLanguage('es')">
            <span class="dot"></span><span class="lang-text">ESPAÑOL</span>
        </div>
        <div class="lang-item" onclick="selectLanguage('de')">
            <span class="dot"></span><span class="lang-text">DEUTSCH</span>
        </div>
    </div>

    <div id="pdfList" class="pdf-list"></div>

    <div style="margin-top: 40px;">
        <img src="https://via.placeholder.com/150x50?text=GF+VICTORIA" alt="Logo GF Victoria" class="footer-logo">
    </div>
</div>

<script>
    const pdfData = {
        es: {
            "Actividades en el agua": "actividades_agua.pdf",
            "Actividades Terrestres": "actividades_tierra.pdf",
            "Barcos": "barcos.pdf",
            "Cielos": "cielos.pdf"
        },
        en: {
            "Water Activities": "water_en.pdf",
            "Land Activities": "land_en.pdf",
            "Boats": "boats_en.pdf",
            "Skies": "skies_en.pdf"
        },
        de: {
            "Wasseraktivitäten": "wasser_de.pdf",
            "Landaktivitäten": "land_de.pdf",
            "Boote": "boote_de.pdf",
            "Himmel": "himmel_de.pdf"
        }
    };

    function selectLanguage(lang) {
        const listDiv = document.getElementById("pdfList");
        listDiv.innerHTML = ''; 
        listDiv.style.display = "block";

        for (const [name, url] of Object.entries(pdfData[lang])) {
            const link = document.createElement("a");
            link.href = url;
            link.target = "_blank";
            link.className = "pdf-item";
            link.textContent = name;
            listDiv.appendChild(link);
        }
        
        // Opcional: Desplazar suavemente hacia las opciones
        listDiv.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
