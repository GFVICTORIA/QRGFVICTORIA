<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Selector de Idioma y PDFs</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 50px;
        background-color: #f0f4f8;
    }
    h1 {
        margin-bottom: 30px;
    }
    .language-btn {
        padding: 12px 24px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background-color: #007bff;
        color: white;
        transition: background 0.3s;
    }
    .language-btn:hover {
        background-color: #0056b3;
    }
    .pdf-list {
        margin-top: 40px;
        display: none;
    }
    .pdf-btn {
        display: block;
        padding: 10px 20px;
        margin: 10px auto;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #28a745;
        color: white;
        width: 200px;
        transition: background 0.3s;
    }
    .pdf-btn:hover {
        background-color: #1e7e34;
    }
</style>
</head>
<body>

<h1>Select language / Selecciona idioma / Sprache wählen</h1>

<!-- Botones de idioma -->
<button class="language-btn" onclick="selectLanguage('es')">Español</button>
<button class="language-btn" onclick="selectLanguage('en')">English</button>
<button class="language-btn" onclick="selectLanguage('de')">Deutsch</button>

<!-- Lista de PDFs según idioma -->
<div class="pdf-list" id="pdfList"></div>

<script>
    // PDFs por idioma
    const pdfData = {
        es: {
            "INFORMACIÓN GENERAL": "general.pdf",
            "BARCOS": "barcos.pdf",
            "ACTIVIDADES - AGUA": "actividades en el agua.pdf",
            "FONDOS MARINOS": "fondos marinos.pdf",
            "ACTIVIDADES - TIERRA": "actividades terrestres.pdf",        
        },
        en: {
            "Main Document": "pdfs/en/documento_en.pdf",
            "Water": "pdfs/en/water.pdf",
            "Earth": "pdfs/en/earth.pdf",
            "Air": "pdfs/en/air.pdf"
        },
        de: {
            "Hauptdokument": "pdfs/de/documento_de.pdf",
            "Wasser": "pdfs/de/wasser.pdf",
            "Erde": "pdfs/de/erde.pdf",
            "Luft": "pdfs/de/luft.pdf"
        }
    };

    function selectLanguage(lang) {
        const pdfListDiv = document.getElementById("pdfList");
        pdfListDiv.innerHTML = ''; // limpiar
        pdfListDiv.style.display = "block";

        for (const [name, url] of Object.entries(pdfData[lang])) {
            const btn = document.createElement("button");
            btn.textContent = name;
            btn.className = "pdf-btn";
            btn.onclick = () => window.open(url, "_blank");
            pdfListDiv.appendChild(btn);
        }
    }
</script>

</body>
</html>
